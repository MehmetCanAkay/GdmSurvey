# Her sağlayıcının önerdiği güncel ana model (Eylül 2026).
# Üç model 29 Eylül 2026'da sağlayıcıların model listesinde doğrulandı.
# Tüm yanıtlar tek bir sorgu oturumunda toplanır. Dönen gerçek sürüm
# responses.model_version_returned alanına yazılır.
#
# temperature tanımlanmaz: bu modeller temperature=0 isteğini reddeder, örnekleme
# sağlayıcı varsayılanında kalır. Tekrarlanabilirlik için düşünme seviyesi
# (reasoning_effort) tüm modellerde aynı değere sabitlenir.
# system_prompt: null tüm modellerde zorunludur.

models:
  - model_id: "M1"
    provider: "OpenAI"
    model_string: "gpt-6-astra"
    reasoning_effort: "medium"
    system_prompt: null

  - model_id: "M2"
    provider: "Anthropic"
    model_string: "claude-opus-5-5"
    reasoning_effort: "medium"
    system_prompt: null

  - model_id: "M3"
    provider: "Google"
    model_string: "gemini-3.8-flash"
    reasoning_effort: "medium"
    system_prompt: null

  # Trendyol/Trendyol-LLM-8B-T1 (Qwen3-8B tabanlı, Apache-2.0), Hugging Face
  # commit 1aeda7229465d71662aacd26e6c6e8f167f683a7, bf16, quantize edilmeden
  # MLX formatına çevrildi ve mlx_lm.server ile yerelde çalıştırıldı.
  #
  # model_string, mlx_lm.server --model argümanıyla karakteri karakterine aynı
  # olmalıdır; farklıysa sunucu bu değeri Hugging Face deposu sanıp sabitlenmemiş
  # sürümü indirmeye çalışır.
  #
  # mlx_lm.server istekte temperature yoksa 0.0 kullanır. Sağlayıcı varsayılanı
  # olarak modelin generation_config.json değerleri sunucu başlatılırken verilir:
  # --temp 0.6 --top-p 0.95 --top-k 20
  #
  # Qwen3'te düşünme seviyesi yoktur, yalnızca açık/kapalıdır. Düşünme modelin
  # varsayılanı olan açık konumdadır (/no_think eklenmez); bu yüzden
  # reasoning_effort boş kalır. <think> bloğu yanıt metninden ayıklanır.
  - model_id: "M4"
    provider: "Yerli"
    model_string: "models/trendyol-llm-8b-t1-1aeda72-bf16"
    reasoning_effort: null
    system_prompt: null
